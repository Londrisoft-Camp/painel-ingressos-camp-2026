services:
  - type: web
    name: painel-ingressos-camp-2026
    runtime: python
    plan: free
    buildCommand: pip install -e .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL_POOLED
        sync: false
      - key: TZ
        value: America/Sao_Paulo
